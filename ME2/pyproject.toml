[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vcm-research"
version = "1.0.0"
description = "Dataset and model-training pipeline for voice-command research"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Dataset preparation verifies Parquet releases and materializes portable WAVs.
dataset = [
  "datasets>=3.0,<5",
  "huggingface-hub>=0.26,<1",
  "numpy>=1.26,<3",
  "pyarrow>=17,<24",
  "scipy>=1.11,<2",
  "soundfile>=0.12.1,<1",
  "tqdm>=4.66,<5",
]
training = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "optuna>=4.0,<5",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "soundfile>=0.12.1,<1",
  "tensorboard>=2.16,<3",
  "torch>=2.3,<3",
  "torchaudio>=2.3,<3",
  "tqdm>=4.66,<5",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
